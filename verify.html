<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
    <style>
        body {
            background-image: url('img/backlogin.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(255, 255, 255, 1);
            padding: 80px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 735px;
        }
        .back-link {
            display: block;
            text-align: left;
            margin-bottom: 20px;
            font-size: 14px;
            color: black;
            text-decoration: none;
        }

    </style>
</head>
<body>
    <div class="login-container ">
        <a href="index.html" class="back-link"><i class="fas fa-chevron-left"></i> Back to login</a>
        <h2 class="text-start">Verify Code</h2>
        <p class="text-start">An authentication code has been sent to you email.</p>
        <form>
            <div class="mb-3 text-start">
                <label for="Enter Code" class="form-label">Enter Code</label>
                <div class="input-group">
                    <input type="Enter Code" class="form-control" id="Enter Code" placeholder="Enter Enter Code">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="fa fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mt-2" >
                Didn’t receive a code? <a href="verify.html" class="text-decoration-none">Resend</a>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Verify</button>
        </form>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordField = document.getElementById('password');
            const icon = document.querySelector('#togglePassword i');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');  
            } else {
                passwordField.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    </script>
</body>
</html>
